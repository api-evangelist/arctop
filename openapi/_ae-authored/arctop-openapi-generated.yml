components:
  schemas:
    PostRequest:
      type: object
      properties:
        event_type:
          type: string
        label:
          type: string
    PostResponse:
      type: object
      properties:
        marker:
          type: object
          properties:
            timestamp:
              type: integer
            app_id:
              type: string
            event_type:
              type: string
            label:
              type: string
        results:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
              status:
                type: string
              session_id:
                type: string
    GetApiDevV1GroupMembersResponse:
      type: object
      properties:
        id:
          type: string
          description: User UUID
        email:
          type: string
          description: User email
        name:
          type: string
          description: User display name
        role:
          type: string
          description: '`admin` or `member`'
        joined_at:
          type: string
          description: Timestamp when the user joined the group
    PostApiDevV1SessionsCurrentMarkersRequest:
      type: object
      properties:
        event_type:
          type: string
          description: Type of the marker event
        label:
          type: string
          description: Optional label for the marker
        timestamp:
          type: integer
          description: Epoch milliseconds; defaults to arrival time
      required:
      - event_type
    PostApiDevV1SessionsCurrentMarkersResponse:
      type: object
      properties:
        marker.timestamp:
          type: integer
          description: Timestamp stored
        marker.app_id:
          type: string
          description: '`dev_api`'
        marker.event_type:
          type: string
          description: '`dev_marker`'
        marker.label:
          type: string
          description: Composed label `event_type:label`
        results:
          type: array
          description: Per‑target write results
    GetApiDevV1SessionsIdResponse:
      type: object
      properties:
        agent_version:
          type: string
          description: Version of the recording agent
        error_message:
          type: string
          description: Error message if any
        output_file_count:
          type: integer
          description: Number of output files
    GetApiDevV1SessionsIdIdResponse:
      type: object
      properties:
        event_type:
          type: string
          description: '`user_marker`, `wear_state`, or `dev_marker`'
        timestamp:
          type: integer
          description: Epoch milliseconds
        label:
          type: string
          description: Marker label
        user_id:
          type: string
          description: User who generated the marker
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
